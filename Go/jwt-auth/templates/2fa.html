<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>2FA Setup</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f5f5f5;

                display: flex;
                justify-content: center;
                align-items: center;

                min-height: 100vh;
                margin: 0;
            }

            .card {
                background: white;
                width: 400px;
                padding: 32px;
                border-radius: 12px;
                text-align: center;

                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }

            .qr {
                width: 256px;
                height: 256px;
                margin: 20px auto;
            }

            .secret {
                padding: 12px;
                background: #f3f3f3;
                border-radius: 6px;

                font-family: monospace;
                word-break: break-all;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <h1>Set up 2FA</h1>

            <p>Scan this QR code using your authenticator app.</p>

            <img
                class="qr"
                src="data:image/png;base64,{{ .QRCode }}"
                alt="2FA QR Code"
            />

            <p>Or enter the secret manually:</p>

            <div class="secret">{{ .Secret }}</div>
        </div>
    </body>
</html>

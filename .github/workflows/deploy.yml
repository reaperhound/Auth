name: Deploy Go API

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: Go/jwt-auth

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Go/jwt-auth/go.mod
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build -o server ./cmd/server

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}"> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }}>> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp \
          -i ~/.ssh/deploy_key \
          -P ${{ secrets.EC2_PORT }} \
          server \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/Auth/Go/jwt-auth/server.new

      - name: Restart Service
        working-directory: .
        run: |
          ssh -i ~/.ssh/deploy_key \
          ${{ secrets.EC2_USER }}@{{ secrets.EC2_HOST }} \
          "sudo systemctl restart jwt-auth"

      - name: Verify Service
        working-directory: .
        run: |
          ssh -i ~/.ssh/deploy_keys \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "sudo systemctl is-active jwt-auth"

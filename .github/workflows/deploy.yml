name: Deploy Go API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Go/jwt-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Go/jwt-auth/go.mod
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build -o server ./cmd/server

      - name: Configure SSH
        working-directory: .
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Upload binary
        working-directory: .
        run: |
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "${{ secrets.EC2_PORT }}" \
            Go/jwt-auth/server \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/Auth/Go/jwt-auth/server.new"

      - name: Replace binary and restart service
        working-directory: .
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.EC2_PORT }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mv /home/ec2-user/Auth/Go/jwt-auth/server.new /home/ec2-user/Auth/Go/jwt-auth/server && sudo systemctl restart jwt-auth"

      - name: Verify Service
        working-directory: .
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.EC2_PORT }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo systemctl is-active --quiet jwt-auth"
